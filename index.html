<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Day Challenge</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#16a34a;--tint:#ecfdf3;--border:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#4ade80;--tint:#14301f;--border:#374151}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#4ade80;--tint:#14301f;--border:#374151}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--muted);margin:0 0 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 12px;z-index:1}
.bar{height:12px;background:var(--border);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.9rem;color:var(--muted)}
button{font:inherit;font-size:.85rem;padding:4px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
.day{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.day.done{background:var(--tint);border-color:var(--accent)}
.day input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
.day b{width:64px;flex:none}
.day input[type=text]{flex:1;min-width:0;padding:8px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font:inherit}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>100 Day Challenge</h1>
    <p class="sub">Tick each day and add a quick note.</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="stat"><span id="count">0 / 100 days</span><button id="reset">Reset</button></div>
  </div>
  <div id="list"></div>
</main>
<script>
var KEY = "challenge100", state = { done: {}, notes: {} };
try { state = JSON.parse(localStorage.getItem(KEY)) || state; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

var list = document.getElementById("list");
for (var i = 1; i <= 100; i++) {
  (function (n) {
    var row = document.createElement("div");
    row.className = "day" + (state.done[n] ? " done" : "");
    row.innerHTML = '<input type="checkbox" aria-label="Day ' + n + ' done"><b>Day ' + n +
      '</b><input type="text" placeholder="Note for day ' + n + '...">';
    var box = row.children[0], note = row.children[2];
    box.checked = !!state.done[n];
    note.value = state.notes[n] || "";
    box.onchange = function () {
      state.done[n] = box.checked;
      row.classList.toggle("done", box.checked);
      save(); update();
    };
    note.oninput = function () { state.notes[n] = note.value; save(); };
    list.appendChild(row);
  })(i);
}

function update() {
  var c = 0;
  for (var k in state.done) if (state.done[k]) c++;
  document.getElementById("count").textContent = c + " / 100 days";
  document.getElementById("fill").style.width = c + "%";
}
update();

var rb = document.getElementById("reset"), armed = false;
rb.onclick = function () {
  if (!armed) {
    armed = true; rb.textContent = "Click again to confirm";
    setTimeout(function () { armed = false; rb.textContent = "Reset"; }, 3000);
    return;
  }
  state = { done: {}, notes: {} }; save(); location.reload();
};
</script>
</body>
</html>
