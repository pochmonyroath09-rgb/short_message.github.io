
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Birthday message for you Bobiee 🎂💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #713b50;
      background: linear-gradient(135deg, #fff0f5, #f8d9e8, #fce7f3);
    }

    .card {
      width: 100%;
      max-width: 430px;
      margin: 35px auto;
      padding: 30px 22px;
      border: 1px solid #ffffff;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 12px 35px #a64d791c;
    }

    .heart {
      font-size: 48px;
      animation: heartbeat 1.5s infinite;
    }

    h1 {
      color: #d64f83;
      font-size: 28px;
    }

    .subtitle {
      line-height: 1.7;
      color: #896b7a;
    }

    .name-button {
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #f8d3e3;
      color: #8d3158;
      font-size: 16px;
      cursor: pointer;
      transition: 0.25s;
    }

    .name-button:hover {
      background: #e978a6;
      color: white;
      transform: translateY(-2px);
    }

    #message {
      display: none;
      margin-top: 22px;
      padding: 20px 14px;
      border-radius: 16px;
      background: #fff0f6;
      line-height: 1.8;
      animation: appear 0.5s ease;
    }

    #message h2 {
      color: #d64f83;
      font-size: 20px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #a58a98;
    }

    @keyframes heartbeat {
      50% { transform: scale(1.15); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="heart">💌</div>

    <h1> Birthday message for you Bobiee 🎂💌</h1>

    <p class="subtitle">
      A letter for you, from Monyroath.<br>
      click your name and read your message. 💗
    </p>

    <button class="name-button"
      onclick="showMessage('Jasmine(Meyhor)')">
      🌷 Jasmine(Meyhor) 🌷
    </button>

    <section id="message" aria-live="polite"></section>

    <p class="footer">
      Made with love, just for you ♡
    </p>
  </main>

 
<script>
  const messages = {
    "Jasmine": {
      title: "Dear Jasmine 🌷",
      text: `Happy Birthday to my bestie!! 🎂❤️🎉

Another year older, another year crazier! 😭😂 
I hope your special day is filled with happiness, love, laughter, and lots of cake. 
May all your wishes come true, and may this year bring you so many beautiful memories.
Since you're in Grade 12 and graduating this year, I wish you the best of luck with your studies and exams. 🎓📚
I hope all your hard work pays off and that you achieve the results you've been dreaming of. 
I know this year might be stressful, with so many things to study and so many worries about the future, 
but please don't forget to take care of yourself and enjoy the little moments, too.
We're getting older, and soon we'll be stepping into a new chapter of life. 🥹❤️ 
I hope you achieve your dreams, meet wonderful people, and become the person you've always wanted to be. 
No matter where life takes you after graduation, I hope we will always stay friends and make more crazy memories together.
And please, even after you graduate, don't act like you're too educated to know me anymore. 😭💀 
I'll expose all your embarrassing moments if you do! HAHAHA! 😂
Once again, Happy Birthday, bestie! I wish you happiness, good health, success in your exams, and a beautiful future ahead. 
Keep smiling, keep fighting, and never give up on your dreams. I'm so proud of you, and I'm so lucky to have you as my friend. Love you always, my crazy girl! 🫶🏻💗🎂🎓`
    }
  };

  function showMessage(name) {
    const messageBox = document.getElementById("message");
    const message = messages[name];

    if (!message) return;

    messageBox.innerHTML = "";

    const heading = document.createElement("h2");
    heading.textContent = message.title;

    const paragraph = document.createElement("p");
    paragraph.textContent = message.text;

    messageBox.append(heading, paragraph);
    messageBox.style.display = "block";

    messageBox.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }
</script>
